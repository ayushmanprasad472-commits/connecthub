<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectHub — Your Feed</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
</head>
<body>

<div class="app-layout">

  <!-- Top Navbar -->
  <nav class="navbar">
    <a class="nav-logo" href="feed.html">
      <div class="logo-icon" style="font-size:20px;color:var(--accent2)">⬡</div>
      <span class="logo-text">ConnectHub</span>
    </a>

    <div class="nav-search">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search ConnectHub..." id="searchInput" />
    </div>

    <div class="nav-actions">
      <div class="nav-btn" title="Messages" onclick="showToast('💬 Messages coming soon!')">
        💬<div class="badge">3</div>
      </div>
      <div class="nav-btn" title="Notifications" onclick="showToast('🔔 Notifications coming soon!')">
        🔔<div class="badge">7</div>
      </div>
      <div class="nav-avatar" id="navAvatar" onclick="toggleProfileMenu()"></div>
    </div>

    <!-- Profile dropdown -->
    <div class="profile-dropdown hidden" id="profileDropdown">
      <div class="dropdown-header">
        <div class="dropdown-avatar" id="dropdownAvatar"></div>
        <div>
          <div class="dropdown-name" id="dropdownName"></div>
          <div class="dropdown-email" id="dropdownEmail"></div>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" onclick="showToast('👤 Profile page coming soon!')">👤 View Profile</div>
      <div class="dropdown-item" onclick="showToast('⚙️ Settings coming soon!')">⚙️ Settings</div>
      <div class="dropdown-item danger" onclick="logout()">↩ Sign Out</div>
    </div>
  </nav>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-profile" id="sidebarProfile">
      <div class="avatar" id="sidebarAvatar"></div>
      <div class="info">
        <div class="name" id="sidebarName"></div>
        <div class="handle" id="sidebarHandle"></div>
      </div>
    </div>

    <div>
      <div class="sidebar-section-title" style="margin-bottom:8px">Menu</div>
      <div class="sidebar-menu">
        <a class="sidebar-item active"><span class="icon">🏠</span> Home Feed</a>
        <a class="sidebar-item" onclick="showToast('👥 Friends page coming soon!')"><span class="icon">👥</span> Friends</a>
        <a class="sidebar-item" onclick="showToast('📸 Photos coming soon!')"><span class="icon">📸</span> Photos</a>
        <a class="sidebar-item" onclick="showToast('🎮 Gaming coming soon!')"><span class="icon">🎮</span> Gaming</a>
        <a class="sidebar-item" onclick="showToast('📅 Events coming soon!')"><span class="icon">📅</span> Events</a>
        <a class="sidebar-item" onclick="showToast('🏘️ Communities coming soon!')"><span class="icon">🏘️</span> Communities</a>
        <a class="sidebar-item" onclick="showToast('📺 Watch coming soon!')"><span class="icon">📺</span> Watch</a>
        <a class="sidebar-item" onclick="showToast('🛒 Marketplace coming soon!')"><span class="icon">🛒</span> Marketplace</a>
      </div>
    </div>

    <div style="margin-top:auto; font-size:11px; color:var(--text-subtle); padding: 0 8px; line-height:1.7">
      ConnectHub Demo · Made with ♥<br/>
      <a href="index.html" onclick="logout()" style="color:var(--text-subtle)">Sign Out</a>
    </div>
  </aside>

  <!-- Main Feed -->
  <main class="feed-column" id="feedColumn">

    <!-- Story bar -->
    <div class="story-bar" id="storyBar">
      <div class="story-add" onclick="showToast('📖 Stories coming soon!')">
        <div class="story-plus">＋</div>
        <span>Add Story</span>
      </div>
      <!-- Stories populated by JS -->
    </div>

    <!-- Post Composer -->
    <div class="post-composer">
      <div class="composer-top">
        <div class="composer-avatar" id="composerAvatar"></div>
        <textarea
          class="composer-textarea"
          id="postText"
          placeholder="What's on your mind?"
          rows="3"
        ></textarea>
      </div>
      <div class="composer-actions">
        <button class="composer-action-btn" onclick="showToast('📸 Photo upload coming soon!')">📸 Photo</button>
        <button class="composer-action-btn" onclick="showToast('🎥 Video upload coming soon!')">🎥 Video</button>
        <button class="composer-action-btn" onclick="showToast('😊 Emoji picker coming soon!')">😊 Feeling</button>
        <button class="post-submit" onclick="submitPost()">Post</button>
      </div>
    </div>

    <!-- Posts injected here by feed.js -->
    <div id="feedPosts"></div>

  </main>

  <!-- Right Sidebar -->
  <aside class="right-sidebar">

    <!-- Friend Suggestions -->
    <div class="widget-card">
      <div class="widget-title">
        People You May Know
        <a href="#" onclick="showToast('👥 Friend suggestions coming soon!')">See All</a>
      </div>
      <div id="friendSuggestions"></div>
    </div>

    <!-- Trending -->
    <div class="widget-card">
      <div class="widget-title">Trending Now</div>
      <div id="trendingTopics"></div>
    </div>

    <!-- Online Friends -->
    <div class="widget-card">
      <div class="widget-title">
        Friends Online
        <span style="width:8px;height:8px;background:var(--success);border-radius:50%;display:inline-block"></span>
      </div>
      <div id="onlineFriends"></div>
    </div>

  </aside>

</div>

<!-- Profile dropdown overlay -->
<div class="dropdown-overlay hidden" id="dropdownOverlay" onclick="closeProfileMenu()"></div>

<style>
/* ── Profile dropdown ── */
.profile-dropdown {
  position: fixed;
  top: 66px;
  right: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px;
  min-width: 240px;
  box-shadow: var(--shadow);
  z-index: 200;
  animation: fadeIn 0.2s ease;
}
.dropdown-overlay {
  position: fixed; inset: 0; z-index: 150;
}
.dropdown-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: var(--radius-sm);
  background: var(--surface2);
  margin-bottom: 6px;
}
.dropdown-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-main); font-weight: 700; font-size: 16px; color: #fff;
}
.dropdown-name { font-size: 14px; font-weight: 600; color: var(--text); }
.dropdown-email { font-size: 11px; color: var(--text-subtle); }
.dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }
.dropdown-item {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  color: var(--text-muted);
  transition: background 0.15s;
}
.dropdown-item:hover { background: var(--surface2); color: var(--text); }
.dropdown-item.danger { color: var(--danger); }
.dropdown-item.danger:hover { background: rgba(239,68,68,0.1); }

/* ── Story bar ── */
.story-bar {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.story-add {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  flex-shrink: 0;
}
.story-plus {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--surface2);
  border: 2px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: var(--accent2);
  transition: border-color 0.2s;
}
.story-add:hover .story-plus { border-color: var(--accent); }
.story-add span, .story-bubble span {
  font-size: 11px; color: var(--text-muted); text-align: center; max-width: 64px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.story-bubble {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer; flex-shrink: 0;
}
.story-ring {
  width: 64px; height: 64px;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}
.story-avatar-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-main); font-weight: 700; font-size: 20px; color: #fff;
  border: 2px solid var(--bg);
}

/* ── Friend suggestion card ── */
.suggest-card {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.suggest-card:last-child { border-bottom: none; }
.suggest-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.suggest-info { flex: 1; }
.suggest-name { font-size: 13px; font-weight: 600; color: var(--text); }
.suggest-mutual { font-size: 11px; color: var(--text-subtle); }
.suggest-add {
  padding: 5px 12px;
  background: rgba(124,92,255,0.12);
  border: 1px solid rgba(124,92,255,0.3);
  border-radius: var(--radius-sm);
  color: var(--accent2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.suggest-add:hover { background: rgba(124,92,255,0.25); }
</style>

<script src="scripts/feed.js"></script>
</body>
</html>
